# The family's hub, and optionally your own relay for reaching it from outside the house.
#   docker compose -f deploy/compose.yaml up -d hub
#   docker compose -f deploy/compose.yaml --profile relay up -d
# A fresh hub prints a setup code in its log (docker compose logs hub), or run
#   docker compose -f deploy/compose.yaml exec hub /app/bin/den_hub setup-code
# and enter it in the Den app to add the hub to your family.
services:
  hub:
    build:
      context: ..
      dockerfile: deploy/hub/Dockerfile
    image: ghcr.io/xattribution/den-hub:latest
    restart: unless-stopped
    # Host networking lets phones and Home Assistant find the hub by mDNS; it listens on 47733.
    network_mode: host
    environment:
      DEN_NAME: "Den hub"
      # DEN_RELAY: "https://relay.den.family"        # reach the hub from anywhere
      # DEN_PUBLIC_URL: "https://den.example.com"    # behind a TLS proxy, for OAuth (claude.ai)
      # DEN_HA_URL: "http://homeassistant.local:8123"
      # DEN_HA_TOKEN: "${DEN_HA_TOKEN}"               # Home Assistant long-lived token, for reminders
      # DEN_LOG: "info"
    # Reminder targets per person go in notify.json in the volume:
    #   {"members": {"Alex": {"ha": "mobile_app_alex_phone", "ntfy": "https://ntfy.sh/den-alex-7f3k"}}}
    volumes:
      - den-hub:/data

  relay:
    profiles: [relay]
    build:
      context: ..
      dockerfile: deploy/relay/Dockerfile
    image: ghcr.io/xattribution/den-relay:latest
    restart: unless-stopped
    ports:
      - "47734:47734"
    volumes:
      - den-relay:/data

volumes:
  den-hub:
  den-relay:
