# dnsmasq for the private setup (docs/hosting.md, "Private: home networks plus Tailscale").
#
# Phones with Tailscale on ask this server for den.<domain>, through Tailscale's split DNS (the
# tailnet's DNS settings send it only that name), and get the server's Tailscale addresses, so
# the same https://den.<domain> goes through the tunnel. Without Tailscale they ask the public DNS
# and get the server's public address instead. One name, one origin: the Home Screen app keeps
# its storage either way.
#
# The name comes from DEN_DOMAIN in .env: compose.yaml adds
#   --interface-name=<DEN_DOMAIN>,tailscale0/4   answer it with tailscale0's IPv4 address,
#                                                whatever it is (nothing to update when moving)
#   --local=/<DEN_DOMAIN>/                       never ask anyone else about it: AAAA gets an
#                                                empty answer, so phones use the IPv4 one

# Listen on Tailscale's interface and loopback only, and follow their addresses as they come and
# go: tailscale0 may come up after dnsmasq does. The firewall drops port 53 from anywhere else,
# and the tailnet policy lets only the family through tailscale0.
interface=tailscale0
interface=lo
bind-dynamic

# Never read /etc/resolv.conf: on a Tailscale machine it can lead to 100.100.100.100, which would
# send the family domain's names right back here. Names other than Den's (only asked if the
# split DNS covers the whole family domain) go to these, and only these.
no-resolv
server=1.1.1.1
server=1.0.0.1

# Nothing from this machine's /etc/hosts; no plain names or private reverse lookups upstream.
no-hosts
domain-needed
bogus-priv
cache-size=500
