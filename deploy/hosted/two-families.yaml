# Two families on one server: a hub each, with its own data volume, port and address, behind
# one Caddy that routes by hostname. Neither hub can see the other's data; each family adds its
# hub with its own setup code. docs/hosting.md, "Several families on one server". From this
# folder:
#
#   cp env.two-families.example .env       # set both domains; it also picks this file
#   docker compose up -d --build
#   docker compose exec hub-a /app/bin/den_hub setup-code     # family A's setup code
#   docker compose exec hub-b /app/bin/den_hub setup-code     # family B's setup code
#   docker compose run --rm backup-a                          # family A's backup, into backups/a
#
# A third family is another hub like these (the next port, its own volume), a backup service
# like theirs, and a block in Caddyfile.two-families.
name: den-families

x-logging: &logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

x-hub: &hub
  build:
    context: ../..
    dockerfile: deploy/hub/Dockerfile
  image: ${DEN_IMAGE:-den-hub}
  restart: unless-stopped
  networks: [den]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  logging: *logging

x-backup: &backup
  profiles: [backup]
  image: ${DEN_IMAGE:-den-hub}
  entrypoint: ["/app/bin/den-backup"]
  command: ["backup"]
  user: root
  network_mode: none

services:
  hub-a:
    <<: *hub
    environment:
      DEN_NAME: ${FAMILY_A_NAME:-Den hub}
      DEN_PORT: "47733"
      DEN_PUBLIC_URL: https://${FAMILY_A_DOMAIN:?set FAMILY_A_DOMAIN in .env}
      DEN_TRUSTED_PROXIES: 172.30.74.0/24
      DEN_MDNS: "0"
    ports:
      - "127.0.0.1:47733:47733"
    volumes:
      - den-family-a:/data

  hub-b:
    <<: *hub
    environment:
      DEN_NAME: ${FAMILY_B_NAME:-Den hub}
      DEN_PORT: "47735"
      DEN_PUBLIC_URL: https://${FAMILY_B_DOMAIN:?set FAMILY_B_DOMAIN in .env}
      DEN_TRUSTED_PROXIES: 172.30.74.0/24
      DEN_MDNS: "0"
    ports:
      - "127.0.0.1:47735:47735"
    volumes:
      - den-family-b:/data

  caddy:
    image: caddy:2.10.0
    restart: unless-stopped
    environment:
      FAMILY_A_DOMAIN: ${FAMILY_A_DOMAIN}
      FAMILY_B_DOMAIN: ${FAMILY_B_DOMAIN}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile.two-families:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [den]
    depends_on:
      hub-a:
        condition: service_healthy
      hub-b:
        condition: service_healthy
    logging: *logging

  backup-a:
    <<: *backup
    environment:
      DEN_BACKUP_PASSPHRASE: ${DEN_BACKUP_PASSPHRASE:-}
      DEN_BACKUP_KEEP: ${DEN_BACKUP_KEEP:-14}
    volumes:
      - den-family-a:/data
      - ./backups/a:/backups

  backup-b:
    <<: *backup
    environment:
      DEN_BACKUP_PASSPHRASE: ${DEN_BACKUP_PASSPHRASE:-}
      DEN_BACKUP_KEEP: ${DEN_BACKUP_KEEP:-14}
    volumes:
      - den-family-b:/data
      - ./backups/b:/backups

networks:
  den:
    ipam:
      config:
        - subnet: 172.30.74.0/24

volumes:
  den-family-a:
  den-family-b:
  caddy-data:
  caddy-config:
