name: den_hub
description: The Den hub. HTTP API, WebSocket sync, MCP with OAuth, calendar feeds, reminders and mDNS for a family's always-on device.
version: 0.1.0
publish_to: none

environment:
  sdk: ^3.10.4

dependencies:
  args: ^2.7.0
  async: ^2.13.0
  collection: ^1.19.1
  cryptography: ^2.9.0
  den_core:
    path: ../den_core
  den_net:
    path: ../den_net
  den_sett_import:
    path: ../den_sett_import
  http: ^1.5.0
  mime: ^2.0.0
  shelf: ^1.4.2
  shelf_router: ^1.1.4
  shelf_static: ^1.1.3
  shelf_web_socket: ^3.0.0
  stream_channel: ^2.1.4
  timezone: ^0.11.2
  web_socket_channel: ^3.0.3

dev_dependencies:
  den_relay:
    path: ../den_relay
  lints: ^6.1.0
  multicast_dns: ^0.3.3
  sqlite3: ^3.7.1
  test: ^1.31.1
