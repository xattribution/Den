name: screenshots

# Renders the golden screenshots on Linux with the real bundled fonts and pushes the images to
# the branch screenshots/<branch>, so how the app looks can be reviewed without a local
# Flutter: `git fetch origin screenshots/<branch>` and open the PNGs. It runs on a pull request
# labeled "screenshots" (and on every push to it while the label is on), or by hand from the
# Actions tab once this file is on the default branch. See DESIGN.md, "Screenshots".

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      tests:
        description: Test files or folders under app/ to render, separated by spaces
        required: false
        default: test/design test/screens

concurrency:
  group: screenshots-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  shots:
    name: Render screenshots
    if: github.event_name == 'workflow_dispatch' || contains(github.event.pull_request.labels.*.name, 'screenshots')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: flutter pub get
      # Brand images (tagged golden) are written outside app/ and rendered by hand.
      - name: Render
        id: render
        working-directory: app
        env:
          TESTS: ${{ inputs.tests || 'test/design test/screens' }}
        run: |
          touch "$RUNNER_TEMP/start"
          sleep 1
          # shellcheck disable=SC2086
          flutter test --update-goldens --exclude-tags golden $TESTS > "$RUNNER_TEMP/test.txt" 2>&1 && status=0 || status=$?
          cat "$RUNNER_TEMP/test.txt"
          if [ "$status" -ne 0 ]; then
            python3 ../.github/scripts/annotate_failures.py test "$RUNNER_TEMP/test.txt" "flutter test"
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Push to screenshots/<branch>
        env:
          BRANCH: ${{ github.head_ref || github.ref_name }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/shots"
          mkdir -p "$out/app"
          cd app
          find test -name '*.png' -newer "$RUNNER_TEMP/start" -print0 | while IFS= read -r -d '' f; do
            mkdir -p "$out/app/$(dirname "$f")"
            cp "$f" "$out/app/$f"
          done
          # The lockfile this run resolved, for updating the branch's own after a dependency change.
          cp pubspec.lock "$out/app/pubspec.lock"
          cd "$out"
          count=$(find app -name '*.png' | wc -l)
          {
            echo "# Screenshots of $BRANCH"
            echo
            echo "$count images rendered from $SHA in $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo
            find app -name '*.png' | sort | sed 's/^/- /'
          } > README.md
          target="screenshots/$BRANCH"
          git init -q
          git checkout -q -b "$target"
          git add -A
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit -q -m "Screenshots of $BRANCH at ${SHA:0:7}"
          git push -q -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/$target"
          {
            echo "### $count screenshots"
            echo
            echo "Branch \`$target\`: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/tree/$target"
            echo
            echo '```'
            echo "git fetch origin $target:refs/remotes/origin/$target"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/shots
      - name: Fail if a test failed
        if: steps.render.outputs.failed == 'true'
        run: |
          echo "Some tests failed while rendering; the images that did render were pushed."
          exit 1
