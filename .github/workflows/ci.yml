name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.38.5'

jobs:
  # Decide which jobs a change needs, so a fix to one package doesn't rebuild everything.
  # Tags, manual runs and changes to this file run every job.
  changes:
    name: What changed
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      packages: ${{ steps.pick.outputs.packages }}
      app: ${{ steps.pick.outputs.app }}
      homeassistant: ${{ steps.pick.outputs.homeassistant }}
      images: ${{ steps.pick.outputs.images }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: f
        with:
          filters: |
            ci: ['.github/workflows/**']
            den_core: ['packages/den_core/**']
            den_net: ['packages/den_core/**', 'packages/den_net/**']
            den_capture: ['packages/den_core/**', 'packages/den_capture/**']
            den_relay: ['packages/den_core/**', 'packages/den_net/**', 'packages/den_relay/**']
            den_sett_import: ['packages/den_core/**', 'packages/den_sett_import/**']
            den_hub: ['packages/**', 'deploy/hub/**']
            den_hub_cli: ['packages/**', 'deploy/hub/**']
            app: ['packages/den_core/**', 'packages/den_net/**', 'packages/den_capture/**', 'packages/den_hub/**', 'packages/den_relay/**', 'app/**']
            homeassistant: ['integrations/**']
            images: ['packages/**', 'app/**', 'deploy/**']
      - id: pick
        env:
          CHANGES: ${{ steps.f.outputs.changes }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          all='["den_core","den_net","den_capture","den_relay","den_hub","den_hub_cli","den_sett_import"]'
          if [ "$EVENT" = workflow_dispatch ] || [[ "$REF" == refs/tags/* ]] || echo "$CHANGES" | grep -q '"ci"'; then
            echo "packages=$all" >> "$GITHUB_OUTPUT"; echo "app=true" >> "$GITHUB_OUTPUT"; echo "homeassistant=true" >> "$GITHUB_OUTPUT"; echo "images=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "packages=$(echo "$CHANGES" | jq -c '[.[] | select(startswith("den_"))]')" >> "$GITHUB_OUTPUT"
          echo "app=$(echo "$CHANGES" | jq 'index("app") != null')" >> "$GITHUB_OUTPUT"
          echo "homeassistant=$(echo "$CHANGES" | jq 'index("homeassistant") != null')" >> "$GITHUB_OUTPUT"
          echo "images=$(echo "$CHANGES" | jq 'index("images") != null')" >> "$GITHUB_OUTPUT"

  packages:
    name: Dart packages
    needs: [changes]
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.changes.outputs.packages) }}
    steps:
      - uses: actions/checkout@v4
      - uses: dart-lang/setup-dart@v1
        with:
          sdk: '3.10.4'
      - name: Resolve
        working-directory: packages/${{ matrix.package }}
        run: dart pub get
      - name: Analyze
        working-directory: packages/${{ matrix.package }}
        run: dart analyze --fatal-infos
      - name: Test
        working-directory: packages/${{ matrix.package }}
        run: dart test
      - name: Build the hub binary
        if: matrix.package == 'den_hub_cli'
        working-directory: packages/den_hub_cli
        run: dart build cli

  app:
    name: App analyze and test
    needs: [changes]
    if: needs.changes.outputs.app == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: flutter analyze
      # Golden images are rendered on Windows by the people reviewing them; elsewhere
      # test/flutter_test_config.dart renders every screen without comparing pixels. The app
      # icon's source (tagged golden) is skipped.
      - working-directory: app
        run: flutter test --exclude-tags golden

  homeassistant:
    name: Home Assistant integration
    needs: [changes]
    if: needs.changes.outputs.homeassistant == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # hassfest checks custom_components/ at the root of what it's given; the action takes no
      # path, so run its image on the integration's folder.
      - name: hassfest
        run: docker run --rm -v "$PWD/integrations/homeassistant:/github/workspace" ghcr.io/home-assistant/hassfest
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Test
        working-directory: integrations/homeassistant
        run: |
          python -m pip install -r requirements_test.txt
          python -m pytest -q

  # HACS installs from the root of a repository, so the integration is published from
  # den-homeassistant. This builds that repository's files and den.zip; it pushes nothing.
  homeassistant-release:
    name: Home Assistant release zip
    needs: [homeassistant]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Prepare den-homeassistant and den.zip
        run: python integrations/homeassistant/scripts/prepare_hacs_repo.py dist/den-homeassistant --zip dist/den.zip
      - uses: actions/upload-artifact@v4
        with:
          name: den-homeassistant-zip
          path: dist/den.zip
      - uses: actions/upload-artifact@v4
        with:
          name: den-homeassistant-repo
          path: dist/den-homeassistant

  # On a release tag, attach den.zip to the GitHub release; the only job that may write.
  homeassistant-publish:
    name: Attach den.zip to the release
    needs: [homeassistant-release]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: den-homeassistant-zip
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/den.zip
          fail_on_unmatched_files: true

  build:
    name: Build ${{ matrix.target }}
    needs: [packages, app]
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: android
            os: ubuntu-latest
            command: flutter build apk --release
            artifact: app/build/app/outputs/flutter-apk/app-release.apk
          - target: web
            os: ubuntu-latest
            command: flutter build web --release
            artifact: app/build/web
          - target: linux
            os: ubuntu-latest
            command: flutter build linux --release
            artifact: app/build/linux/x64/release/bundle
          - target: windows
            os: windows-latest
            command: flutter build windows --release
            artifact: app/build/windows/x64/runner/Release
          - target: macos
            os: macos-latest
            command: flutter build macos --release
            artifact: app/build/macos/Build/Products/Release
          - target: ios
            os: macos-latest
            command: flutter build ios --release --no-codesign
            artifact: app/build/ios/iphoneos
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - if: matrix.target == 'linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build libgtk-3-dev libsecret-1-dev
      - uses: actions/setup-java@v4
        if: matrix.target == 'android'
        with:
          distribution: temurin
          java-version: '21'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - working-directory: app
        run: flutter pub get
      - working-directory: app
        run: ${{ matrix.command }}
      - uses: actions/upload-artifact@v4
        with:
          name: den-${{ matrix.target }}
          path: ${{ matrix.artifact }}

  # Build the hub and relay images on every change that touches them (one platform, nothing
  # pushed), so a broken Dockerfile or a web build that fails under --csp shows up in review
  # rather than at release.
  image-check:
    name: Image builds (${{ matrix.image }})
    needs: [changes]
    if: github.event_name == 'pull_request' && needs.changes.outputs.images == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        image: [hub, relay]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        id: build
        with:
          context: .
          file: deploy/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
      # Job logs aren't always readable by reviewers; repeat the failing step's output (the
      # builder still holds every layer before it, so this is quick) as an annotation.
      - name: Explain a failed build
        if: failure() && steps.build.outcome == 'failure'
        run: |
          docker buildx build --progress=plain --platform linux/amd64 \
            -f deploy/${{ matrix.image }}/Dockerfile . > build.log 2>&1 || true
          msg=$(grep -vE '^#[0-9]+ (sha256:|extracting|resolve|DONE|CACHED|\[internal\]|transferring)' build.log \
            | tail -n 120 | sed 's/%/%25/g; s/\r/%0D/g' | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::error title=Image build (${{ matrix.image }})::$msg"

  images:
    name: Docker images
    needs: [packages]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        image: [hub, relay]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/den-${{ matrix.image }}:latest
            ghcr.io/${{ github.repository_owner }}/den-${{ matrix.image }}:${{ github.ref_name }}
