<!DOCTYPE html>
<html lang="en">
<head>
  <!-- The path Den is served from; `flutter build web --base-href /den/` for a subpath. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="The family's calendar, chores, lists and stars">
  <meta property="og:title" content="Den">
  <meta property="og:description" content="The family's calendar, chores, lists and stars">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:type" content="website">

  <!-- Added to the Home Screen, Den opens as its own app named Den. The status bar follows the
       phone's light or dark setting; the page under it is the app's page color. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Den">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="application-name" content="Den">
  <meta name="theme-color" content="#F2F2F2" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Den</title>

  <!-- The page is the app's page color from the first frame (#F2F2F2, true black at night), so
       opening Den never flashes white.
       It never scrolls: Flutter draws everything in one canvas pinned to the top, so a page
       that moved would show its own empty background instead of the app (den_web.js puts it
       back when iOS moves it for the keyboard anyway). html and body fill the layout viewport,
       and body is where Flutter puts its view. -->
  <style>
    html, body {
      position: fixed;
      top: 0; right: 0; bottom: 0; left: 0;
      width: 100%; height: 100%;
      margin: 0; padding: 0;
      overflow: hidden;
      overscroll-behavior: none;
      background: #F2F2F2;
    }
    @media (prefers-color-scheme: dark) { html, body { background: #000000; } }
  </style>
  <!-- The face every word is drawn in, fetched while Flutter starts rather than after. -->
  <link rel="preload" href="assets/assets/fonts/AtkinsonHyperlegibleNext.ttf" as="fetch" crossorigin>
  <script src="den_web.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
