<!DOCTYPE html>
<html lang="en">
<head>
  <!-- The path Den is served from; `flutter build web --base-href /den/` for a subpath. -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="The family's calendar, chores, lists and points">

  <!-- Added to the Home Screen, Den opens as its own app named Den. The status bar follows the
       phone's light or dark setting; the page under it is the app's paper color. -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Den">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="application-name" content="Den">
  <meta name="theme-color" content="#FBFAF7" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#15120F" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <title>Den</title>

  <!-- The page is the app's paper color from the first frame, light or dark, so opening Den
       never flashes white. -->
  <style>
    html, body { margin: 0; height: 100%; background: #FBFAF7; }
    @media (prefers-color-scheme: dark) { html, body { background: #15120F; } }
  </style>
  <script src="den_web.js"></script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
