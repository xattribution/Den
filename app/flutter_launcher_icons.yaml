flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # web/icons and web/favicon.png come from test/icon/icon_test.dart (maskable icons with the
  # mark inside the safe circle, an apple-touch-icon); web/manifest.json is kept by hand.
  web:
    generate: false
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
