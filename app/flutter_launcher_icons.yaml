flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  # web/manifest.json and web/icons are kept by hand: maskable icons with the mark inside the
  # safe circle, an apple-touch-icon, and colors for both themes.
  web:
    generate: false
  windows:
    generate: true
    icon_size: 256
  macos:
    generate: true
